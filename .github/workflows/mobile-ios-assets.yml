name: Prepare HOCKEY LIVE iOS artwork
on:
  workflow_dispatch:
  push:
    branches: [feature/hockey-live-4-ios]
    paths:
      - '.github/workflows/mobile-ios-assets.yml'
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hockey-live-4-ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 1024px opaque iOS icon and splash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original=Image.open('icon-512.png').convert('RGBA')
          assert original.width==original.height and original.width>=512
          background=Image.new('RGB',original.size,(7,14,29))
          background.paste(original,mask=original.getchannel('A'))
          icon=background.resize((1024,1024),Image.Resampling.LANCZOS)
          out=Path('mobile/assets')
          out.mkdir(parents=True,exist_ok=True)
          icon.save(out/'icon.png',format='PNG',optimize=True)
          icon.save(out/'splash-icon.png',format='PNG',optimize=True)
          assert Image.open(out/'icon.png').mode=='RGB'
          print('Prepared',out/'icon.png',icon.size)
          PY
      - name: Commit generated artwork to feature branch
        run: |
          git config user.name 'hockey-live-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/icon.png mobile/assets/splash-icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare 1024px opaque iPhone app icon and splash artwork'
            git pull --rebase origin feature/hockey-live-4-ios
            git push origin HEAD:feature/hockey-live-4-ios
          fi
