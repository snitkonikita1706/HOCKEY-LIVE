name: Проверка источника КЛХЛ
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-klhl.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить доступ к четырём календарям
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re
          for i in [1066652,1066653,1066654,1066655]:
              url=f'https://fhkostanay.kz/tournament/{i}/calendar'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=14) as f:
                      body=f.read().decode('utf-8','replace')
                  title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                  print(i,'HTTP 200 bytes',len(body),'title',title.group(1)[:100] if title else '<none>','waf',('SafeLine' in body))
              except Exception as e:
                  print(i,type(e).__name__,str(e)[:200])
          PY
