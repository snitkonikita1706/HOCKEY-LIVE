name: Обновить календарь КХЛ
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Обновить матчи
        run: python update_khl.py
      - name: Опубликовать изменившиеся данные
        run: |
          git config user.name 'hockey-live-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/khl.json
          if ! git diff --cached --quiet; then
            git commit -m 'Обновить календарь КХЛ'
            git push
          fi